[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "roadsift-backend-adapters"
version = "0.1.0"
description = "Production-oriented infrastructure adapters for RoadSift: Supabase/Postgres, Cloudflare R2, and Kaggle."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "RoadSift contributors"},
  {name = "OpenAI ChatGPT GPT-5.6 Sol", email = "noreply@openai.com"}
]
dependencies = [
  "boto3>=1.35,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
kaggle = ["kaggle>=1.7,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/roadsift_adapters"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
